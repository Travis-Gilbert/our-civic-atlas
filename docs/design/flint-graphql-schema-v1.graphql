# -----------------------------------------------------------------------------
# Civic research (gap-driven fractal expansion): mutation surface
# -----------------------------------------------------------------------------

"""Inputs for the civicResearch mutation. Optional fields are propagated to
the Theseus harness; the resolver applies sensible defaults when they are
omitted. The harness response shape is normalized to SearchResults before
return so callers do not depend on harness internals."""
input CivicResearchInput {
  """Free-text research query. The algorithm decides the expansion frontier."""
  query: String!

  """Optional Theseus harness budget knobs. Recognized keys (subject to
  harness contract): `max_hops` (Int), `frontier_width` (Int),
  `max_tokens` (Int), `wall_clock_seconds` (Int). When omitted, harness
  defaults apply. Untyped because the harness budget vocabulary evolves
  faster than this schema can re-version."""
  budget: JSON

  """Optional scope hints (era, neighborhood, source filters). Recognized
  keys (subject to harness contract): `era` (string label e.g. '1900-1930'),
  `bbox` (BboxInput JSON), `place_ids` ([String]), `source_ids` ([String]),
  `min_confidence` (Float). Untyped for the same reason as `budget`."""
  scope: JSON

  """Optional session identifier so multiple research calls can be grouped
  by the harness for cross-call caching and follow-up steps."""
  sessionId: String

  """Optional folio identifier when this research call is part of a curated
  workspace. Lets the harness attribute artifacts to a folio."""
  folioId: String
}

"""Payload returned by civicResearch. Carries the harness run identifier
(so the frontend can correlate later state, replay, or follow-up calls),
the name of the skill the harness ran, and the evidence the algorithm
surfaced in the SearchResults shape callers already know."""
type CivicResearchPayload {
  """The Theseus harness run identifier this query was attached to. Stable
  for the lifetime of the run; can be re-used by future calls (e.g., for
  context recall, replay, or compare flows)."""
  runId: ID!

  """The Theseus skill the harness executed (e.g., 'fractal_expansion').
  Surfaces here so the frontend can adapt presentation when the resolver
  starts dispatching to alternative skills in the future."""
  skill: String!

  """Evidence the algorithm surfaced. Same shape as searchAtlas results so
  injection into atlas state is a single merge step. Empty arrays when the
  algorithm finds nothing, never null."""
  results: SearchResults!

  """Unsaved sources surfaced by the run. These are candidate records only:
  callers may display, rank, or cache them, but they do not become durable
  reconstruction evidence until explicitly promoted through
  promoteResearchArtifact."""
  candidateSources: [ResearchCandidateSource!]!
}

"""A reviewable source candidate surfaced by civicResearch. Candidate records
may be materialized in the Civic RustyRed hot graph for fast follow-up, but
PostGIS remains canonical and promotion is explicit."""
type ResearchCandidateSource {
  """Stable candidate id scoped to this research result."""
  candidateId: ID!

  """Research run that surfaced this candidate."""
  runId: ID!

  """Source/result id selected from the research response."""
  sourceId: ID!

  """Resident-readable source title."""
  title: String!

  """Source family used by reconstruction filtering."""
  sourceType: String!

  """Canonical URL when the research result provided one."""
  uri: String

  """Review/trust tier carried from the source result."""
  trustTier: String!

  """Candidate confidence when the upstream result provided one."""
  confidence: Float

  """Lifecycle state. Contract v1 emits only `candidate`."""
  status: String!

  """Optional parcel/civic-object key from the research scope."""
  parcelRef: String

  """Optional target year from the research scope."""
  year: Int

  """Stable key for a Civic RustyRed hot-graph node if/when candidates are
  materialized outside PostGIS."""
  candidateGraphKey: String!

  """Mutation that turns this candidate into canonical PostGIS evidence."""
  promotionMutation: String!

  """Suggested source-use tags for the explicit promotion form."""
  proposedUseTags: [String!]!

  """Machine-readable envelope for cache/projection layers. Includes
  candidateStore=civic_rustyred_candidate_graph, canonicalStore=postgis_artifacts,
  and autoPromote=false."""
  payload: JSON!
}

"""A source selected from civicResearch and promoted into the tenant-scoped
artifact store. The resolver attaches TenantContext server-side and writes
to the backend artifacts + artifact_anchors tables; the browser never sends
service-tier credentials."""
input ResearchArtifactPromotionInput {
  """Optional stable key. When omitted, the resolver derives a deterministic
  research:<source-or-run>:<hash> key so repeat promotions upsert."""
  artifactKey: ID

  """Harness run id returned by civicResearch."""
  runId: ID

  """Source/result id selected from civicResearch results."""
  sourceId: ID

  """Optional candidate id returned by civicResearch.candidateSources. The
  resolver records it in metadata only; it does not make unsaved research
  durable without this explicit promotion."""
  candidateId: ID

  """Source family used by reconstruction filtering (directory,
  archival_photo, map, text, etc.)."""
  sourceType: String!

  """Resident-readable source title."""
  title: String!

  """Canonical source URL when one exists."""
  uri: String

  """Short citation or holding note."""
  citation: String

  """Capture/publication time for the source itself."""
  capturedAt: DateTime

  """JSON object persisted on artifacts.payload_jsonb."""
  payload: JSON

  """Which reconstruction claim(s) this source helps: footprint, facade,
  ground_floor_use, date, contradiction, or other."""
  sourceUseTags: [String!]

  """Short human review note describing why this source was saved."""
  sourceUseNote: String

  """Review state for the saved source. Defaults to
  accepted_for_reconstruction on the backend."""
  reviewState: String

  """UUID or parcel_key. For resident research results, prefer parcel_key
  (for example `carriage-town:3`) so the backend resolves the stable UUID."""
  parcelRef: String

  """Optional building UUID for already-resolved backend objects."""
  buildingId: ID

  """Optional building-part UUID for already-resolved backend objects."""
  buildingPartId: ID

  """Anchor family. Defaults to `research`."""
  anchorKind: String

  """Optional WKT geometry anchor."""
  anchorGeometryWkt: String

  """Optional start of the source's applicability window."""
  anchorTimeStart: DateTime

  """Optional end of the source's applicability window."""
  anchorTimeEnd: DateTime

  """JSON object persisted on artifact_anchors.payload_jsonb."""
  anchorPayload: JSON
}

"""Result of promoting a research source into durable reconstruction input."""
type ResearchArtifactPromotionPayload {
  artifactId: ID!
  artifactKey: ID!
  status: String!
}

# =============================================================================
# Atelier extensions (added 2026-05-23)
# =============================================================================
#
# The Atelier is the workshop surface where the reconstruction engine's
# eight stages become visible, cinematic, and clickable. See:
#   - SPEC-THE-ATELIER.md (304-line spec)
#   - docs/plans/the-atelier/graphql-contract.md (Extensions 1-7)
#   - docs/plans/the-atelier/implementation-plan.md (PT-101)
#
# All resolvers attach TenantContext server-side via the Axum
# civic-atlas-server (no frontend-held tokens). Same architectural
# pattern as the civicResearch mutation above.
#
# Extension 6 (ReconstructionPipelineTrace) is DEFERRED to v1.x and
# intentionally omitted from this schema until the Rust engine instruments
# per-stage events. Until then the frontend choreographer synthesizes the
# 8 stages deterministically from ReconstructionDossier output.
# =============================================================================

# -----------------------------------------------------------------------------
# Extension 1: Per-part confidence on HistoricalReconstruction
# -----------------------------------------------------------------------------

enum RoofForm {
  FLAT
  GABLE
  HIPPED
}

extend type HistoricalReconstruction {
  """Per-part confidence in [0, 1]. When null, the consumer falls back to
  the top-level `confidence` (Mass) for that zone. Maps to
  ReconstructionSpec.facades[0].provenance.confidence in the backend."""
  facadeConfidence: Float

  """Per-part confidence in [0, 1]. Maps to
  ReconstructionSpec.roof.provenance.confidence."""
  roofConfidence: Float

  """Per-part confidence in [0, 1]. Maps to
  ReconstructionSpec.ground_floor.provenance.confidence."""
  groundFloorConfidence: Float

  """Drives mesh dispatch: flat / gable / hipped. Maps to
  ReconstructionSpec.roof.form. Defaults to FLAT when omitted."""
  roofForm: RoofForm
}

# -----------------------------------------------------------------------------
# Extension 2: Evidence (source cards)
# -----------------------------------------------------------------------------

enum EvidenceType {
  SANBORN
  PHOTOGRAPH
  DIRECTORY
  CITY_DIRECTORY
  TEXT_MENTION
  PLAT_MAP
  HABS_RECORD
  OTHER
}

"""A single piece of archival evidence that fed into a reconstruction.
The atelier renders one source card per item with visual identity
dispatched on `evidenceType`."""
type EvidenceItem {
  """Stable id. Prefix: 'evidence:'."""
  id: ID!

  """Which reconstruction this evidence supports."""
  reconstructionId: ID!

  """The source this evidence is drawn from."""
  source: Source!

  """The type of evidence. Drives card visual identity per spec lines 36-38."""
  evidenceType: EvidenceType!

  """Where in the reconstruction node tree this evidence applies. Null
  when the evidence is whole-building. Format matches ReconstructionNodeId
  in src/lib/atlas/reconstruction-node-tree.ts."""
  targetNodeId: String

  """Confidence the engine assigned to this evidence item, in [0, 1]."""
  confidence: Float!

  """Optional URL to a thumbnail. Null when the card renders text-only."""
  thumbnailUrl: String

  """Brief plain-language summary the card surfaces under the source name."""
  summary: String

  """ISO 8601 date the source originates from."""
  sourceDateLabel: String
}

"""Bundle of all evidence backing one reconstruction."""
type EvidenceBundle {
  reconstructionId: ID!
  items: [EvidenceItem!]!
  totalCount: Int!
}

# -----------------------------------------------------------------------------
# Extension 3: MergeConflict
# -----------------------------------------------------------------------------

"""A disagreement between evidence sources resolved by the merge step.
Surfaces on the building as a clickable terracotta marker."""
type MergeConflict {
  """Stable id. Prefix: 'merge-conflict:'."""
  id: ID!

  reconstructionId: ID!

  """Which part of the reconstruction the conflict targets. Stable
  reconstruction-node-tree id."""
  targetNodeId: String!

  """Plain civic-language field name (e.g., 'Stories', 'Roof material')."""
  fieldLabel: String!

  """One entry per disagreeing source. Order: most-confident first."""
  disagreements: [MergeDisagreement!]!

  """The value the merge step chose."""
  resolvedValue: String!

  """Plain-language explanation of WHY this value won."""
  resolutionExplanation: String!

  """The confidence threshold the merge step applied (default 0.7)."""
  resolutionThreshold: Float!
}

type MergeDisagreement {
  source: Source!

  """Plain-language label of what this source said."""
  statedValue: String!

  """Engine confidence in this evidence item."""
  confidence: Float!

  """Reference to the underlying evidence item."""
  evidenceItemId: ID!
}

# -----------------------------------------------------------------------------
# Extension 4: BlockSubgraph
# -----------------------------------------------------------------------------

"""The block-scope subgraph the engine consulted when reconstructing a
building. Used by atelier Stage 3 highlight pulse."""
type BlockSubgraph {
  reconstructionId: ID!
  neighbors: [BlockNeighbor!]!
}

type BlockNeighbor {
  reconstruction: HistoricalReconstruction!

  """The relation between focus and neighbor. From the CivicPairformerConfig
  10-relation vocabulary."""
  relation: String!

  """Strength of the relation in [0, 1]."""
  strength: Float!
}

# -----------------------------------------------------------------------------
# Extension 5: ReconstructionDossier (one-shot atelier payload)
# -----------------------------------------------------------------------------

"""One-shot atelier payload. Bundles the reconstruction itself, its
evidence, its conflicts, its block subgraph. Used by the atelier on
open. Empty arrays when the engine has no data; never null."""
type ReconstructionDossier {
  reconstruction: HistoricalReconstruction!
  evidence: EvidenceBundle!
  conflicts: [MergeConflict!]!
  blockSubgraph: BlockSubgraph!

  """The Pascal-node tree the atelier uses to address parts."""
  nodeTree: JSON!

  """Plain civic-language summary the dossier renders at the top."""
  summary: String!

  """Optional debug metadata for telemetry. Never user-facing."""
  debug: JSON
}

# -----------------------------------------------------------------------------
# Extension 7: saveReconstruction (v1, real backend wiring)
# -----------------------------------------------------------------------------

"""A saved reconstruction view. The id and shareUrl let the user return to
the exact atelier surface they saved."""
type SavedReconstruction {
  """Stable id. Prefix: 'saved-reconstruction:'."""
  id: ID!

  reconstructionId: ID!

  """The atlas year at the moment of save."""
  year: Int!

  """Stable URL the user can bookmark or share."""
  shareUrl: String!

  """ISO 8601 timestamp the save was created."""
  savedAt: DateTime!

  """Optional: when contributor_email was provided, the email a receipt
  was sent to. Always null in v1 reads."""
  contributorEmailDigest: String
}

input SaveReconstructionInput {
  reconstructionId: ID!
  year: Int!
  contributorEmail: String
  caption: String
}

# -----------------------------------------------------------------------------
# Atelier queries + mutations
# -----------------------------------------------------------------------------

extend type Query {
  """Returns the evidence bundle for one reconstruction. Used by the atelier
  to render source cards around the building footprint."""
  evidenceForReconstruction(reconstructionId: ID!): EvidenceBundle!

  """Returns the conflicts the merge step surfaced. Empty array when no
  conflicts. Markers stay visible as long as the atelier is open."""
  conflictsForReconstruction(reconstructionId: ID!): [MergeConflict!]!

  """Returns the block-scope subgraph the engine consulted. Used by
  atelier Stage 3."""
  blockSubgraphForReconstruction(reconstructionId: ID!): BlockSubgraph!

  """Returns the full atelier-open payload for one reconstruction.
  Single round-trip so the atelier can prepare side panel + animation
  stage data without N+1 fetches."""
  reconstructionDossier(reconstructionId: ID!): ReconstructionDossier!

  """Runs the live reconstruction pipeline for a parcel/civic-object id and
  target year. This is the resident-facing atelier entry point; saved/spec-id
  URLs continue to use reconstructionDossier."""
  reconstructionFor(parcelId: ID!, year: Int!): ReconstructionDossier

  """Returns a saved reconstruction by its id. Used by the
  /open-flint-atlas/atelier/saved/<saved-id> route. Public read; no
  auth required."""
  savedReconstruction(id: ID!): SavedReconstruction
}

extend type Mutation {
  """Promote a selected civicResearch source into the durable artifact store
  so future reconstructionFor runs can consume it without a separate bulk
  ingest lane."""
  promoteResearchArtifact(input: ResearchArtifactPromotionInput!): ResearchArtifactPromotionPayload!

  """Persist a reconstruction view so the user can return to it. Follows
  the same anonymous-but-receipt-able write pattern as submitObservation
  (no auth required; optional email for receipt). Resolver writes to a
  new Postgres table `saved_reconstructions` via the Axum
  civic-atlas-server resolver; TenantContext attached server-side.

  Uses ONLY existing Axum + Postgres + PostGIS infrastructure. Does NOT
  block on the upcoming files SDK or the in-deployment RustyRed graph
  DB. v2 extends with user-edited corrections per spec line 169
  parenthetical."""
  saveReconstruction(input: SaveReconstructionInput!): SavedReconstruction!
}

# -----------------------------------------------------------------------------
# Extension 8: Traffic realtime (per-segment flow on the road network)
# -----------------------------------------------------------------------------
#
# Traffic is a domain on the reconstruction engine, not a bespoke feature
# (see docs/plans/traffic-domain-realtime/). This first slice is the REALTIME
# mechanism only: a per-segment flow snapshot mapped onto road-network edges,
# which the atlas renders as animated flow. No travel-demand model is involved
# here; the feed is ground truth. Historic replay and future-projection (the
# four-step SUMO model) are later extensions against the same segment shape.
#
# This contract is the typed, curation-boundary form of the REST shape the
# frontend already renders (src/lib/api/openFlintAtlas.ts). Bringing it under
# the schema means every segment property is typed and allow-listed: nothing
# from the Theseus backend can leak through. The REST shim in
# /api/v2/theseus/open-flint-atlas/* retires once the resolver lands (per the
# schema header).
#
# Calibration discipline (binding, mirrors the reconstruction honesty contract):
# every segment carries how its numbers were obtained (estimateBasis), whether
# the source is actually live (sourceStatus), and a confidence. The engine
# NEVER reports sourceStatus LIVE for a fixture or inferred segment. A flow
# estimate with no provenance is a bug, not a feature.

"""How a segment's flow numbers were derived."""
enum TrafficEstimateBasis {
  """Mapped from a live sensor feed (loop detector, probe, 511 / MDOT RIDE)."""
  LIVE_FEED
  """Inferred from an hourly AADT / time-of-day pattern, no current count."""
  HOURLY_PATTERN
  """Produced by a scenario / projection model run, not an observation."""
  SCENARIO_MODEL
}

"""Whether the segment's number is backed by an actually-live source right now.
Distinct from estimateBasis: a segment can be shaped for a LIVE_FEED basis while
its source is still a FIXTURE until the authenticated feed is wired."""
enum TrafficSourceStatus {
  """A live upstream source is currently feeding this segment."""
  LIVE
  """Official historical traffic counts back this segment; hourly flow is inferred."""
  HISTORIC_AVERAGE
  """A local fixture stands in for the eventual live source."""
  FIXTURE
  """The live source is identified but not yet connected."""
  PENDING_LIVE_SOURCE
}

"""Whole-snapshot feed status. The UI must not present FIXTURE_FALLBACK as live."""
enum TrafficFeedStatus {
  LIVE
  HISTORIC_AVERAGE
  FIXTURE_FALLBACK
  UNAVAILABLE
}

"""One road segment carrying flow. geometry is the LineString the animation
tweens particles along; volumePerHour drives particle density and speedMph
drives tween duration, so a congested street visibly carries many slow particles
and a free one carries few fast ones."""
type TrafficSegment {
  """Stable id. Prefix: 'traffic:'. Matches the RustyRed edge id."""
  segmentId: ID!
  """Human corridor name (e.g. 'Saginaw Street downtown')."""
  corridorName: String!
  """Direction / orientation label shown in the panel."""
  directionLabel: String!
  """The segment centerline. GeoJSON LineString in WGS84."""
  geometry: GeoJSON!
  """How this segment's numbers were derived."""
  estimateBasis: TrafficEstimateBasis!
  """Whether the source is actually live right now."""
  sourceStatus: TrafficSourceStatus!
  """Short source attribution rendered verbatim (e.g. 'MDOT RIDE target, fixture mirror')."""
  sourceLabel: String!
  """Honest one-line note on what this segment is and is not."""
  supportNote: String!
  """ISO 8601 time the reading reflects."""
  observedAt: DateTime!
  """ISO 8601 time the reading goes stale, when known."""
  expiresAt: DateTime
  """Mean speed in mph at observedAt. Drives particle tween duration."""
  speedMph: Float!
  """Free-flow (uncongested) speed in mph. speedMph is read against this."""
  freeFlowSpeedMph: Float!
  """Vehicles per hour. Drives particle density."""
  volumePerHour: Float!
  """Volume-to-capacity style ratio in [0, 1]; drives the congestion colour."""
  congestionRatio: Float!
  """Confidence in [0, 1]. 1.0 for a direct live reading; lower for inferred."""
  confidence: Float!
}

"""Roll-up the panel renders above the segment list."""
type TrafficRealtimeSummary {
  segmentCount: Int!
  liveFeedSegments: Int!
  inferredSegments: Int!
  congestedSegments: Int!
  averageSpeedMph: Float!
  averageCongestionRatio: Float!
}

"""One-shot realtime traffic payload for a road-network area at a moment.
Empty segments array when the engine has no data; never null."""
type TrafficRealtimeSnapshot {
  """Stable feed id. Prefix: 'traffic:'."""
  feedId: ID!
  """Display source attribution for the whole snapshot."""
  sourceLabel: String!
  """Optional homepage / docs URL for the source."""
  sourceUrl: String
  """Whole-snapshot status. FIXTURE_FALLBACK and UNAVAILABLE are never 'live'."""
  status: TrafficFeedStatus!
  """ISO 8601 time the snapshot was generated."""
  generatedAt: DateTime!
  """How often the client should re-poll, in seconds."""
  refreshIntervalSeconds: Int!
  summary: TrafficRealtimeSummary!
  """The road segments carrying flow. Empty when the network has none."""
  segments: [TrafficSegment!]!
}

extend type Query {
  """Returns the current realtime traffic snapshot for a road-network area.
  networkId selects the area (e.g. 'flint'). Single round-trip so the surface
  can drive the animation without N+1 fetches. When no live feed is wired,
  status is FIXTURE_FALLBACK and segments carry FIXTURE / PENDING_LIVE_SOURCE
  sourceStatus: the engine never reports LIVE for a fixture segment."""
  trafficRealtime(networkId: ID!): TrafficRealtimeSnapshot!
}
