# -----------------------------------------------------------------------------
# Civic research (gap-driven fractal expansion): mutation surface
# -----------------------------------------------------------------------------

"""Inputs for the civicResearch mutation. Optional fields are propagated to
the Theseus harness; the resolver applies sensible defaults when they are
omitted. The harness response shape is normalized to SearchResults before
return so callers do not depend on harness internals."""
input CivicResearchInput {
  """Free-text research query. The algorithm decides the expansion frontier."""
  query: String!

  """Optional Theseus harness budget knobs. Recognized keys (subject to
  harness contract): `max_hops` (Int), `frontier_width` (Int),
  `max_tokens` (Int), `wall_clock_seconds` (Int). When omitted, harness
  defaults apply. Untyped because the harness budget vocabulary evolves
  faster than this schema can re-version."""
  budget: JSON

  """Optional scope hints (era, neighborhood, source filters). Recognized
  keys (subject to harness contract): `era` (string label e.g. '1900-1930'),
  `bbox` (BboxInput JSON), `place_ids` ([String]), `source_ids` ([String]),
  `min_confidence` (Float). Untyped for the same reason as `budget`."""
  scope: JSON

  """Optional session identifier so multiple research calls can be grouped
  by the harness for cross-call caching and follow-up steps."""
  sessionId: String

  """Optional folio identifier when this research call is part of a curated
  workspace. Lets the harness attribute artifacts to a folio."""
  folioId: String
}

"""Payload returned by civicResearch. Carries the harness run identifier
(so the frontend can correlate later state, replay, or follow-up calls),
the name of the skill the harness ran, and the evidence the algorithm
surfaced in the SearchResults shape callers already know."""
type CivicResearchPayload {
  """The Theseus harness run identifier this query was attached to. Stable
  for the lifetime of the run; can be re-used by future calls (e.g., for
  context recall, replay, or compare flows)."""
  runId: ID!

  """The Theseus skill the harness executed (e.g., 'fractal_expansion').
  Surfaces here so the frontend can adapt presentation when the resolver
  starts dispatching to alternative skills in the future."""
  skill: String!

  """Evidence the algorithm surfaced. Same shape as searchAtlas results so
  injection into atlas state is a single merge step. Empty arrays when the
  algorithm finds nothing, never null."""
  results: SearchResults!
}
