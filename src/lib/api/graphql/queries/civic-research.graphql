mutation CivicResearch(
  $query: String!
  $budget: JSON
  $scope: JSON
  $sessionId: String
  $folioId: String
) {
  civicResearch(
    input: {
      query: $query
      budget: $budget
      scope: $scope
      sessionId: $sessionId
      folioId: $folioId
    }
  ) {
    runId
    skill
    results {
      query
      totalResultCount
      reranked
      acceptedConfidenceFloor
      inferredTimeRange {
        start
        end
        label
      }
      places {
        id
        name
        placeType
        centroid
        confidence
        temporalStatus
      }
      signals {
        id
        signalKind
        title
        summary
        publishedAt
        relativeTimeLabel
        confidence
        place {
          id
          name
        }
      }
      events {
        id
        title
        summary
        occurredAt
        confidence
        place {
          id
          name
        }
      }
      historicalReconstructions {
        id
        name
        description
        position
        confidence
        timeStart
        timeEnd
      }
      sources {
        id
        name
        sourceType
        trustTier
      }
    }
  }
}
