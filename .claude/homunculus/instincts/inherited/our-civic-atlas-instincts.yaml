# Our Civic Atlas Workflow Feature Module Expansion With Graphql Contract

## Action

Follow the feature-module-expansion-with-graphql-contract workflow:
1. Edit or add GraphQL schema in docs/design/flint-graphql-schema-v1.graphql
2. Add or update GraphQL queries/mutations in src/lib/api/graphql/queries/*.graphql
3. Regenerate GraphQL types in src/lib/api/graphql/generated/gql.ts and graphql.ts
4. Add or update UI components in src/components/atlas/ and src/app/open-flint-atlas/plan/
5. Update or add supporting TypeScript logic in src/lib/atlas/
6. Add or update fixtures/data in src/data/open-flint-atlas/fixtures/
7. Update or add relevant documentation in docs/plans/
8. Update tsconfig.json or next-env.d.ts if needed

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: docs/design/flint-graphql-schema-v1.graphql, src/lib/api/graphql/queries/*.graphql, src/lib/api/graphql/generated/gql.ts

